<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Whispr Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0c0a;
    --bg2:#15120e;
    --bg3:#1c1813;
    --panel:#161310;
    --panel-hi:#1e1a14;
    --border:#2b261f;
    --border-hi:#3d362c;
    --text:#ece4d2;
    --text-2:#bdb39e;
    --text-mute:#8a8170;
    --text-dim:#5f574c;
    --accent:#ff7a3d;
    --accent-2:#ffb072;
    --accent-dim:#7a3c1c;
    --success:#5cc78a;
    --success-dim:#1e3a26;
    --warning:#f5c150;
    --warning-dim:#3c2e0f;
    --danger:#e85c5c;
    --danger-dim:#3a1717;
    --blue:#7aaeff;
    --blue-dim:#1c2a4a;

    --r-sm:6px;
    --r-md:8px;
    --r-lg:12px;
    --r-xl:18px;

    --shadow-1: 0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 10px 30px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.5);
    --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'JetBrains Mono', monospace;
    --font-serif: 'Instrument Serif', ui-serif, serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    /* warm subtle vignette */
    background-image:
      radial-gradient(ellipse at top, rgba(255,122,61,.04), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(122,174,255,.03), transparent 50%);
  }
  #root{height:100%}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--border-hi)}

  button{font-family:inherit;font-size:inherit;color:inherit;background:transparent;border:0;cursor:pointer;padding:0}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:transparent;border:0;outline:none}
  input::placeholder,textarea::placeholder{color:var(--text-dim)}

  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .serif{font-family:var(--font-serif);font-style:italic}

  /* ─── Selection ─── */
  ::selection{background:rgba(255,122,61,.35);color:var(--text)}

  /* ─── Keyframes ─── */
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,122,61,.6)}
    50%{box-shadow:0 0 0 14px rgba(255,122,61,0)}
  }
  @keyframes blinkDot{0%,49%{opacity:1}50%,100%{opacity:.25}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @keyframes waveBar{
    0%,100%{transform:scaleY(.35)}
    50%{transform:scaleY(1)}
  }
  @keyframes caretBlink{0%,50%{opacity:1}51%,100%{opacity:0}}

  .fade-up{animation:fadeUp .35s ease both}
  .fade-in{animation:fadeIn .35s ease both}

  /* shimmer for skeleton/transcribing */
  .shimmer{
    background:linear-gradient(90deg, rgba(255,255,255,.02) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.02) 100%);
    background-size:200% 100%;
    animation:shimmer 1.6s linear infinite;
  }

  /* Caret for typewriter */
  .caret::after{
    content:"▍";
    color:var(--accent);
    margin-left:1px;
    animation:caretBlink 1s steps(1) infinite;
    font-weight:500;
  }

  /* Form controls */
  .field{
    background:var(--bg2);
    border:1px solid var(--border);
    border-radius:var(--r-md);
    padding:8px 10px;
    color:var(--text);
    width:100%;
    transition:border-color .15s ease;
  }
  .field:focus{border-color:var(--border-hi)}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="studio-components.jsx"></script>
<script type="text/babel" src="studio-views.jsx"></script>
<script type="text/babel" src="studio-app.jsx"></script>

</body>
</html>
